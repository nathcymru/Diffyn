[package]
name = "diffyn-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]
members = ["."]
resolver = "3"

[package.metadata]
cargo-fuzz = true

[dependencies]
diffyn = { path = "..", version = "=2.0.0" }
libfuzzer-sys = "=0.4.13"
serde_json = "1"

[[bin]]
name = "tools_text"
path = "fuzz_targets/tools_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tools_json"
path = "fuzz_targets/tools_json.rs"
test = false
doc = false
bench = false
