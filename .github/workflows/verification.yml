name: Coverage and repeatability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    name: Source style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned source style tools
        run: |
          python3 -m venv "$RUNNER_TEMP/style-python"
          "$RUNNER_TEMP/style-python/bin/pip" install --disable-pip-version-check -r scripts/requirements-style.txt
          echo "$RUNNER_TEMP/style-python/bin" >> "$GITHUB_PATH"
          npm --prefix scripts/docs ci --ignore-scripts --no-audit --no-fund
      - name: Check Python style and correctness rules
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Check JavaScript formatting
        run: npm --prefix scripts/docs run style:check

  coverage:
    name: Source coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned coverage tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          python3 -m venv "$RUNNER_TEMP/coverage-python"
          "$RUNNER_TEMP/coverage-python/bin/pip" install --disable-pip-version-check coverage==7.17.0
          echo "$RUNNER_TEMP/coverage-python/bin" >> "$GITHUB_PATH"
          npm --prefix scripts/docs ci --ignore-scripts --no-audit --no-fund
      - name: Measure Rust, Python and JavaScript coverage
        run: bash scripts/check-coverage.sh
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-coverage
          path: |
            target/verification/*.json
            target/verification/*.lcov
            target/verification/javascript/coverage-summary.json
            target/verification/javascript/lcov.info
          if-no-files-found: error
          retention-days: 30

  repeatability:
    name: Repeatable Linux build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - name: Monitor build network and runtime activity
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the contributor container on native AMD64
        run: |
          test "$(uname -m)" = x86_64
          docker build --pull --platform linux/amd64 \
            --tag diffyn-devcontainer:ci .devcontainer
      - name: Verify the contributor toolchain and compile the read-only source
        run: |
          docker run --rm --init -i --platform linux/amd64 \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --workdir /workspace \
            --env "EXPECTED_RUST_VERSION=$RUSTUP_TOOLCHAIN" \
            --env CARGO_TARGET_DIR=/tmp/diffyn-target \
            diffyn-devcontainer:ci bash -euo pipefail <<'CHECKS'
          test "$(id -u)" -ne 0
          test "$(rustc --version | cut -d ' ' -f 2)" = "$EXPECTED_RUST_VERSION"
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version
          node -e 'if (process.versions.node.split(".")[0] !== "24") throw new Error("Node.js 24 is required");'
          node --version
          npm --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11 or newer is required"'
          python3 --version
          git --version
          python3 -m venv /tmp/diffyn-venv
          /tmp/diffyn-venv/bin/python -c 'import sys; assert sys.prefix != sys.base_prefix'
          /tmp/diffyn-venv/bin/python -m pip --version
          cargo check --locked --all-targets
          CHECKS
      - name: Install the release toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Compare two clean builds of the committed source
        run: bash scripts/check-repeatable-build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repeatable-linux-build
          path: target/verification/repeatable-build.txt
          if-no-files-found: error
          retention-days: 30
