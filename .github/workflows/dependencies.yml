name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install locked audit tool
        working-directory: ${{ runner.temp }}
        run: cargo +stable install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, licences, bans and sources
        run: cargo +stable deny --locked check
  documentation:
    name: Documentation dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Audit the locked documentation tools
        working-directory: scripts/docs
        run: npm audit --package-lock-only --audit-level=low
