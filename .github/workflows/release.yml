name: Release packages

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the supported Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build and test the release binary
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          cargo +1.99.0 test --locked --release --target "$RELEASE_TARGET"
          cargo +1.99.0 build --locked --release --target "$RELEASE_TARGET"
      - name: Exercise the release process over MCP
        shell: bash
        env:
          DIFFYN_BINARY: target/${{ matrix.target }}/release/diffyn${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python3 tests/stdio_protocol.py
      - name: Package the binary
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/package-release.py binary
      - name: Verify the Cargo source package
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          cargo +1.99.0 package --locked
          cp target/package/diffyn-*.crate dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diffyn-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish versioned packages
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a release commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: diffyn-*
          merge-multiple: true
          path: dist
      - name: Verify the complete package set and write checksums
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/package-release.py checksums
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          create-storage-record: false
      - name: Upload the complete draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --draft --verify-tag \
            --title "Diffyn $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
      - name: Verify the uploaded assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --json assets,isDraft,tagName > "$RUNNER_TEMP/diffyn-release.json"
          python3 scripts/package-release.py verify-release < "$RUNNER_TEMP/diffyn-release.json"
          gh release edit "$RELEASE_TAG" --draft=false
