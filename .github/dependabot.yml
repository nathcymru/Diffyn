version: 2
updates:
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: Europe/London
    labels: [dependencies, ci]
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /container
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Europe/London
    labels: [dependencies, security]
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /
    labels: [dependencies]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      rust-compatible:
        applies-to: version-updates
        update-types: [minor, patch]
      rust-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies, ci]
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /fuzz
    labels: [dependencies]
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      fuzz-compatible:
        applies-to: version-updates
        update-types: [minor, patch]
      fuzz-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /scripts/docs
    labels: [dependencies, documentation]
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      documentation-compatible:
        applies-to: version-updates
        update-types: [minor, patch]
      documentation-security:
        applies-to: security-updates
        patterns: ["*"]
